name: Tests

# Runs the full suites of both packages on every push to main, so a broken
# commit is visible even when no version was bumped (publishes have their
# own gates).

on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  sdocs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -w sdocs

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/vscode/package-lock.json

      - name: Build the sdocs package (the extension bundles sdocs/language)
        working-directory: .
        run: |
          npm ci
          npm run build --workspace sdocs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc

      - name: Test
        run: npm test
