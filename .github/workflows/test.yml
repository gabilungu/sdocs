name: Tests

# Runs the full suites of both packages on every push to main AND on every pull
# request, so a broken commit is visible even when no version was bumped
# (publishes have their own gates).
#
# Pull requests matter more than they look: main is where this project's
# mistakes have landed, and a check that only runs after the merge is a check
# that reports history rather than preventing it.

on:
  push:
    branches: main
  pull_request:
  workflow_dispatch:

# Least privilege: the suites only read the checkout.
permissions:
  contents: read

jobs:
  sdocs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check Svelte and TypeScript
        run: npm run check

      - name: Test
        run: npm test -w sdocs

      # The docs site is the project's own biggest .sdoc corpus, and every
      # release edits it. Compiling it here catches a broken stage before it
      # reaches the deploy, which has no gate of its own.
      - name: Check the docs site compiles
        run: node packages/sdocs/bin/sdocs.js check
        working-directory: apps/docs

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/vscode/package-lock.json

      - name: Build the sdocs package (the extension bundles sdocs/language)
        working-directory: .
        run: |
          npm ci
          npm run build --workspace sdocs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc

      - name: Test
        run: npm test
