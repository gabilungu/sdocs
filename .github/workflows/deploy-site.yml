name: Deploy site to GitHub Pages

# Requires the repo's Pages source to be set to "GitHub Actions".
on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The site embeds the Explorer from the workspace sdocs package
      - name: Build sdocs
        run: npm run build

      - name: Build site
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: npm run site:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages deployments fail transiently ("try again later") now and then;
      # one automatic retry absorbs it.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry deploy
        if: steps.deployment.outcome == 'failure'
        id: deployment-retry
        uses: actions/deploy-pages@v5
